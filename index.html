<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Norte — Sistema Pessoal</title>
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   NORTE — Design Tokens
   ============================================================ */
:root{
  --ink:#0E1116;
  --ink-soft:#12161D;
  --card:#161B24;
  --card-hover:#1B212C;
  --card-raised:#1E2530;
  --border:#252C38;
  --border-soft:#1D232D;
  --text:#EEF1F6;
  --text-dim:#A6AEBF;
  --text-faint:#5E6779;
  --gold:#C9A35F;
  --gold-soft:#C9A35F22;
  --gold-dim:#8C7645;
  --sage:#7FA88C;
  --sage-soft:#7FA88C22;
  --rose:#BD7B7B;
  --rose-soft:#BD7B7B22;
  --sky:#6E93B7;
  --sky-soft:#6E93B722;
  --amber:#D9A05B;
  --danger:#C1666B;
  --danger-soft:#C1666B22;
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --shadow-card:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-pop:0 20px 60px -20px rgba(0,0,0,.7);
  --font-display:'Fraunces', serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --header-h:64px;
  --nav-w:248px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(1100px 600px at 12% -8%, #C9A35F14, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #6E93B712, transparent 60%);
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-.01em;}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--gold-soft); color:var(--text);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#242b37; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ============================================================
   COMPASS SIGNATURE MARK
   ============================================================ */
.compass{display:inline-block; position:relative;}
.compass svg{display:block;}
.compass-spin{animation:compassSpin 3.2s cubic-bezier(.6,0,.4,1) infinite;}
@keyframes compassSpin{
  0%{transform:rotate(0deg);}
  50%{transform:rotate(200deg);}
  100%{transform:rotate(360deg);}
}

/* ============================================================
   LOCK SCREEN
   ============================================================ */
#lock-screen{
  position:fixed; inset:0; z-index:500;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(900px 500px at 50% 0%, #C9A35F10, transparent 60%),
    var(--ink);
  padding:24px;
}
.lock-card{
  width:100%; max-width:380px;
  text-align:center;
  animation:riseIn .7s cubic-bezier(.16,1,.3,1);
}
@keyframes riseIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
.lock-mark{margin:0 auto 28px; width:64px; height:64px; color:var(--gold);}
.lock-title{font-size:26px; margin-bottom:6px;}
.lock-sub{color:var(--text-dim); font-size:14px; margin-bottom:36px; line-height:1.6;}
.code-dots{display:flex; gap:14px; justify-content:center; margin-bottom:28px;}
.code-dot{
  width:14px; height:14px; border-radius:50%;
  border:1.5px solid var(--border); background:transparent;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.code-dot.filled{background:var(--gold); border-color:var(--gold); transform:scale(1.15); box-shadow:0 0 16px #C9A35F55;}
.code-dot.error{border-color:var(--danger); animation:shake .4s;}
@keyframes shake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);}
  40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}
}
#lock-input{
  position:absolute; opacity:0; pointer-events:none;
}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
.keypad button{
  aspect-ratio:1; border-radius:50%; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:20px; font-weight:500;
  cursor:pointer; transition:all .15s;
}
.keypad button:hover{background:var(--card-hover); border-color:var(--gold-dim);}
.keypad button:active{transform:scale(.92); background:var(--gold-soft);}
.keypad button.wide{grid-column:span 1; font-size:13px; color:var(--text-dim);}
.lock-footer{margin-top:22px; font-size:12px; color:var(--text-faint);}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:none; position:relative; z-index:1; min-height:100vh;}
#app.unlocked{display:block;}

.topbar{
  position:fixed; top:0; left:0; right:0; height:var(--header-h);
  display:flex; align-items:center; gap:14px;
  padding:0 20px; background:rgba(14,17,22,.85); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft); z-index:100;
}
.topbar .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-size:18px; font-weight:600;}
.topbar .brand .compass{width:26px; height:26px; color:var(--gold);}
.menu-btn{display:none; background:none; border:none; color:var(--text); font-size:20px; cursor:pointer; padding:6px;}
.topbar-spacer{flex:1;}
.topbar-date{font-size:13px; color:var(--text-dim); font-family:var(--font-mono); display:none;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background:var(--card); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .15s;
}
.icon-btn:hover{color:var(--text); border-color:var(--gold-dim); background:var(--card-hover);}

.sidebar{
  position:fixed; top:var(--header-h); left:0; bottom:0; width:var(--nav-w);
  background:var(--ink-soft); border-right:1px solid var(--border-soft);
  overflow-y:auto; padding:18px 12px 24px; z-index:90;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.nav-group{margin-bottom:4px;}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); padding:16px 12px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:10px;
  color:var(--text-dim); text-decoration:none; font-size:14px; font-weight:500; cursor:pointer;
  transition:all .15s; margin-bottom:1px; border:1px solid transparent;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:var(--card); color:var(--text);}
.nav-item.active{background:linear-gradient(90deg, var(--gold-soft), transparent); color:var(--gold); border-color:#C9A35F2A;}
.nav-item.active svg{opacity:1;}
.nav-item .count{margin-left:auto; font-size:11px; background:var(--card-raised); color:var(--text-dim); padding:1px 7px; border-radius:20px; font-family:var(--font-mono);}

.sidebar-backdrop{display:none; position:fixed; inset:0; background:#000a; z-index:85;}

main{
  margin-left:var(--nav-w); padding-top:var(--header-h);
  min-height:100vh; position:relative;
}
.view-wrap{padding:28px 32px 120px; max-width:1180px;}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.view-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); margin-bottom:6px; font-weight:600;}
.view-title{font-size:30px;}
.view-sub{color:var(--text-dim); font-size:14px; margin-top:6px; max-width:520px; line-height:1.5;}

/* ============================================================
   COMPONENTS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:11px;
  border:1px solid var(--border); background:var(--card); color:var(--text);
  font-size:13.5px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap;
}
.btn:hover{background:var(--card-hover); border-color:var(--gold-dim);}
.btn:active{transform:scale(.97);}
.btn svg{width:15px; height:15px;}
.btn-primary{background:linear-gradient(180deg, #D6B073, var(--gold)); border-color:var(--gold); color:#1A1206; font-weight:700;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-dim);}
.btn-ghost:hover{background:var(--card); color:var(--text);}
.btn-danger{color:var(--danger); border-color:#C1666B33;}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:8px;}
.btn-icon{padding:9px; border-radius:10px;}

.card{
  background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow-card);
}
.card-hover{transition:all .18s cubic-bezier(.4,0,.2,1); cursor:pointer;}
.card-hover:hover{transform:translateY(-2px); border-color:#C9A35F30; box-shadow:0 16px 40px -16px #000a;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1000px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} }

.stat-card{padding:18px 20px;}
.stat-card .lbl{font-size:12px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:7px; margin-bottom:10px;}
.stat-card .lbl svg{width:14px; height:14px;}
.stat-card .val{font-family:var(--font-display); font-size:26px; font-weight:600;}
.stat-card .sub{font-size:12px; color:var(--text-faint); margin-top:4px;}

.progress-track{height:8px; border-radius:20px; background:var(--card-raised); overflow:hidden; position:relative;}
.progress-fill{height:100%; border-radius:20px; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); transition:width .6s cubic-bezier(.16,1,.3,1);}
.progress-fill.sage{background:linear-gradient(90deg,#5E8870,var(--sage));}
.progress-fill.sky{background:linear-gradient(90deg,#4A6E90,var(--sky));}
.progress-fill.rose{background:linear-gradient(90deg,#9A5B5B,var(--rose));}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; border:1px solid transparent;}
.badge-gold{background:var(--gold-soft); color:var(--gold);}
.badge-sage{background:var(--sage-soft); color:var(--sage);}
.badge-rose{background:var(--rose-soft); color:var(--rose);}
.badge-sky{background:var(--sky-soft); color:var(--sky);}
.badge-muted{background:var(--card-raised); color:var(--text-dim);}
.badge-danger{background:var(--danger-soft); color:var(--danger);}

.list{display:flex; flex-direction:column; gap:10px;}
.row-item{
  display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:13px;
  background:var(--card); border:1px solid var(--border-soft); transition:all .15s;
}
.row-item:hover{border-color:#C9A35F26; background:var(--card-hover);}
.row-item .ri-main{flex:1; min-width:0;}
.row-item .ri-title{font-size:14.5px; font-weight:600; margin-bottom:2px;}
.row-item .ri-meta{font-size:12px; color:var(--text-faint); display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.row-item .ri-actions{display:flex; gap:6px; opacity:0; transition:opacity .15s;}
.row-item:hover .ri-actions{opacity:1;}
@media(max-width:768px){ .row-item .ri-actions{opacity:1;} }

.empty-state{
  text-align:center; padding:60px 20px; color:var(--text-faint);
  border:1.5px dashed var(--border); border-radius:var(--radius-lg);
}
.empty-state .compass{width:40px; height:40px; margin-bottom:14px; opacity:.5;}
.empty-state h3{font-size:16px; color:var(--text-dim); margin-bottom:6px;}
.empty-state p{font-size:13px; max-width:320px; margin:0 auto;}

.section-title{font-size:16px; font-weight:600; font-family:var(--font-display); margin:32px 0 14px; display:flex; align-items:center; gap:10px;}
.section-title:first-child{margin-top:0;}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
.search-box{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--border-soft); border-radius:11px; padding:9px 14px;
}
.search-box svg{width:15px; height:15px; color:var(--text-faint); flex-shrink:0;}
.search-box input{background:none; border:none; outline:none; color:var(--text); font-size:13.5px; width:100%;}
select, input[type=text], input[type=date], input[type=time], input[type=number], textarea{
  background:var(--card-raised); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:9px 12px; font-size:13.5px; font-family:inherit; outline:none;
  transition:border-color .15s;
}
select:focus, input:focus, textarea:focus{border-color:var(--gold-dim);}
.chip{padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s;}
.chip.active{background:var(--gold-soft); border-color:#C9A35F55; color:var(--gold);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}

.fab-menu{position:fixed; right:22px; bottom:22px; z-index:200; display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
.fab-options{display:flex; flex-direction:column; gap:9px; margin-bottom:4px;}
.fab-option{
  display:flex; align-items:center; gap:10px; background:var(--card-raised); border:1px solid var(--border);
  padding:9px 9px 9px 16px; border-radius:30px; box-shadow:var(--shadow-pop); cursor:pointer;
  opacity:0; transform:translateY(10px) scale(.9); pointer-events:none; transition:all .2s cubic-bezier(.4,0,.2,1);
  font-size:13px; font-weight:600; color:var(--text);
}
.fab-menu.open .fab-option{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
.fab-option .dot{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.fab-main{
  width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(180deg,#D6B073,var(--gold)); color:#1A1206;
  box-shadow:0 12px 30px -8px #C9A35F70; display:flex; align-items:center; justify-content:center;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.fab-main svg{width:24px; height:24px; transition:transform .25s;}
.fab-menu.open .fab-main svg{transform:rotate(45deg);}
.fab-main:active{transform:scale(.93);}

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(6,8,11,.72); backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; z-index:400; opacity:0;
  transition:opacity .2s; padding:0;
}
.modal-overlay.show{opacity:1;}
.modal-box{
  background:var(--ink-soft); border:1px solid var(--border); border-top-left-radius:24px; border-top-right-radius:24px;
  width:100%; max-width:640px; max-height:92vh; overflow-y:auto; padding:22px 22px 28px;
  transform:translateY(30px); transition:transform .28s cubic-bezier(.16,1,.3,1); box-shadow:var(--shadow-pop);
}
.modal-overlay.show .modal-box{transform:translateY(0);}
@media(min-width:720px){
  .modal-overlay{align-items:center;}
  .modal-box{border-radius:22px; transform:translateY(16px) scale(.98);}
}
.modal-handle{width:38px; height:4px; border-radius:4px; background:var(--border); margin:0 auto 16px; display:none;}
@media(max-width:719px){ .modal-handle{display:block;} }
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:19px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select, .field textarea{width:100%;}
.field textarea{resize:vertical; min-height:70px; line-height:1.55;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:480px){ .field-row{grid-template-columns:1fr;} }
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border-soft);}
.hint{font-size:11.5px; color:var(--text-faint); margin-top:5px;}

/* Toasts */
#toast-root{position:fixed; top:80px; right:20px; z-index:600; display:flex; flex-direction:column; gap:10px; max-width:340px;}
.toast{
  background:var(--card-raised); border:1px solid var(--border); border-left:3px solid var(--gold);
  padding:13px 16px; border-radius:12px; box-shadow:var(--shadow-pop); font-size:13.5px;
  animation:toastIn .3s cubic-bezier(.16,1,.3,1); display:flex; align-items:center; gap:10px;
}
.toast.err{border-left-color:var(--danger);}
.toast.ok{border-left-color:var(--sage);}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.toast svg{width:16px; height:16px; flex-shrink:0;}

/* Timer widget */
.timer-widget{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.timer-display{font-family:var(--font-mono); font-size:38px; font-weight:600; letter-spacing:.02em; color:var(--gold); min-width:150px;}

/* Mood/tag pickers */
.mood-row{display:flex; gap:8px; flex-wrap:wrap;}
.mood-opt{padding:8px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card-raised); cursor:pointer; font-size:18px; transition:all .15s;}
.mood-opt.active{border-color:var(--gold); background:var(--gold-soft); transform:scale(1.08);}

/* Habit heatmap */
.habit-grid{display:grid; grid-template-columns:repeat(14,1fr); gap:4px;}
.hcell{aspect-ratio:1; border-radius:4px; background:var(--card-raised); border:1px solid var(--border-soft);}
.hcell.on{background:var(--sage); border-color:var(--sage);}

/* Utility */
.flex{display:flex;} .items-center{align-items:center;} .gap-8{gap:8px;} .gap-12{gap:12px;}
.text-dim{color:var(--text-dim);} .text-faint{color:var(--text-faint);} .text-sm{font-size:12.5px;}
.mono{font-family:var(--font-mono);}
.divider{height:1px; background:var(--border-soft); margin:18px 0;}
.hidden{display:none !important;}
.prose{white-space:pre-wrap; line-height:1.65; font-size:14.5px; color:var(--text);}
.skeleton{background:linear-gradient(90deg, var(--card) 25%, var(--card-hover) 37%, var(--card) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:10px;}
@keyframes sk{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}

/* Responsive shell */
@media (max-width:900px){
  :root{--nav-w:240px;}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0); box-shadow:24px 0 60px -20px #000a;}
  .sidebar-backdrop.show{display:block;}
  main{margin-left:0;}
  .menu-btn{display:flex; align-items:center; justify-content:center;}
  .view-wrap{padding:20px 16px 110px;}
  .topbar-date{display:none !important;}
}
@media (min-width:901px){
  .topbar-date{display:block;}
}
.badge-status-em_consideracao{background:var(--sky-soft); color:var(--sky);}
.badge-status-tomada{background:var(--gold-soft); color:var(--gold);}
.badge-status-reavaliar{background:var(--amber)22; color:var(--amber);}
.badge-status-concluida{background:var(--sage-soft); color:var(--sage);}
.badge-status-cancelada{background:var(--danger-soft); color:var(--danger);}
.badge-status-pendente{background:var(--card-raised); color:var(--text-dim);}
.badge-status-em_andamento{background:var(--sky-soft); color:var(--sky);}
.badge-status-concluido{background:var(--sage-soft); color:var(--sage);}
.badge-status-confirmado{background:var(--sage-soft); color:var(--sage);}
.badge-status-cancelado{background:var(--danger-soft); color:var(--danger);}
.badge-status-adiado{background:var(--amber)22; color:var(--amber);}
.badge-status-em_oracao{background:var(--sky-soft); color:var(--sky);}
.badge-status-aguardando{background:var(--amber)22; color:var(--amber);}

/* ============================================================

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function fmtDateLong(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('pt-PT', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}
function fmtDateShort(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('pt-PT', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDuration(mins){
  mins = Math.round(mins||0);
  const h = Math.floor(mins/60), m = mins%60;
  if(h<=0) return `${m}min`;
  if(m===0) return `${h}h`;
  return `${h}h ${String(m).padStart(2,'0')}min`;
}
function fmtPct(n){ return (Math.round(n*100)/100).toLocaleString('pt-PT', {maximumFractionDigits:1}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function startOfWeek(d=new Date()){
  const dt = new Date(d); const day = dt.getDay();
  const diff = dt.getDate() - day + (day===0?-6:1);
  const mon = new Date(dt.setDate(diff)); mon.setHours(0,0,0,0);
  return mon;
}
function isoDay(d){ return d.toISOString().slice(0,10); }
function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ============================================================
   TOASTS
   ============================================================ */
function toast(msg, type='ok'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type==='err'?'err':'ok'}`;
  el.innerHTML = `${icon(type==='err'?'x':'check',16)}<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='all .3s'; el.style.opacity='0'; el.style.transform='translateX(30px)'; setTimeout(()=>el.remove(),300); }, 3000);
}

/* ============================================================
   SUPABASE HELPERS (CRUD genérico com feedback)
   ============================================================ */
async function dbList(table, {order='created_at', asc=false, filters=[], limit=500}={}){
  if(!SUPABASE_READY) return [];
  try{
    let q = supabase.from(table).select('*').order(order, {ascending:asc}).limit(limit);
    filters.forEach(f=>{ q = q[f.op](f.col, f.val); });
    const {data, error} = await q;
    if(error) throw error;
    return data||[];
  }catch(e){ console.error(e); toast(`Erro ao carregar "${table}": ${e.message}`, 'err'); return []; }
}
async function dbInsert(table, payload){
  if(!SUPABASE_READY){ toast('Configura o Supabase para guardar dados (ver README).', 'err'); return null; }
  try{
    const {data, error} = await supabase.from(table).insert(payload).select();
    if(error) throw error;
    toast('Guardado com sucesso.');
    return data?.[0]||null;
  }catch(e){ console.error(e); toast(`Erro ao guardar: ${e.message}`, 'err'); return null; }
}
async function dbUpdate(table, id, payload){
  if(!SUPABASE_READY) return null;
  try{
    const {data, error} = await supabase.from(table).update(payload).eq('id', id).select();
    if(error) throw error;
    toast('Atualizado.');
    return data?.[0]||null;
  }catch(e){ console.error(e); toast(`Erro ao atualizar: ${e.message}`, 'err'); return null; }
}
async function dbDelete(table, id){
  if(!SUPABASE_READY) return false;
  try{
    const {error} = await supabase.from(table).delete().eq('id', id);
    if(error) throw error;
    toast('Removido.');
    return true;
  }catch(e){ console.error(e); toast(`Erro ao remover: ${e.message}`, 'err'); return false; }
}

function confirmDialog(msg){
  return new Promise(resolve=>{
    openModal({
      title:'Confirmar',
      bodyHtml:`<p class="prose">${esc(msg)}</p>`,
      footHtml:`<button class="btn btn-ghost" data-act="no">Cancelar</button><button class="btn btn-danger" data-act="yes">Confirmar</button>`,
      onMount:(box)=>{
        box.querySelector('[data-act=no]').onclick=()=>{closeModal(); resolve(false);};
        box.querySelector('[data-act=yes]').onclick=()=>{closeModal(); resolve(true);};
      }
    });
  });
}

/* ============================================================
   MODAL
   ============================================================ */
function openModal({title, bodyHtml, footHtml='', onMount, wide=false}){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box" style="${wide?'max-width:760px':''}">
        <div class="modal-handle"></div>
        <div class="modal-head"><h3>${esc(title)}</h3>
          <button class="icon-btn" id="modal-close">${icon('x',15)}</button>
        </div>
        <div id="modal-body">${bodyHtml}</div>
        <div class="modal-foot">${footHtml}</div>
      </div>
    </div>`;
  const overlay = document.getElementById('modal-overlay');
  requestAnimationFrame(()=>overlay.classList.add('show'));
  document.getElementById('modal-close').onclick = closeModal;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  if(onMount) onMount(document.getElementById('modal-body').closest('.modal-box'));
}
function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.classList.remove('show');
  setTimeout(()=>{ document.getElementById('modal-root').innerHTML=''; }, 200);
}
window.closeModal = closeModal;

async function navigate(route){
  state.route = route;
  location.hash = route;
  renderSidebar();
  const wrap = document.getElementById('view');
  wrap.innerHTML = `<div class="grid grid-4">${Array.from({length:4}).map(()=>'<div class="skeleton" style="height:96px"></div>').join('')}</div>`;
  window.scrollTo(0,0);
  const fn = VIEW_RENDERERS[route] || VIEW_RENDERERS['dashboard'];
  try{ await fn(wrap); }
  catch(e){ console.error(e); wrap.innerHTML = `<div class="empty-state">${icon('compass2',40)}<h3>Ocorreu um erro ao carregar esta secção</h3><p>${esc(e.message)}</p></div>`; }
}
window.addEventListener('hashchange', ()=>{
  const r = location.hash.replace('#','');
  if(r && r!==state.route) navigate(r);
});

  const kp = document.getElementById('keypad');

    b.addEventListener('click', ()=>{
      if(b.dataset.k==='⌫'){ enteredCode = enteredCode.slice(0,-1); }

      if(enteredCode.length===6) checkCode();

}

  document.querySelectorAll('.code-dot').forEach((d,i)=>{

/* ============================================================
   GERADOR GENÉRICO DE FORMULÁRIOS (usado por vários módulos)
   ============================================================ */
function fieldHtml(f, val){
  val = val==null? (f.default!==undefined? f.default : '') : val;
  const id = `f_${f.key}`;
  if(f.type==='textarea'){
    return `<div class="field" style="${f.span?'grid-column:1/-1':''}"><label for="${id}">${f.label}</label><textarea id="${id}" placeholder="${f.placeholder||''}">${esc(val)}</textarea>${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  }
  if(f.type==='select'){
    return `<div class="field"><label for="${id}">${f.label}</label><select id="${id}">${f.options.map(o=>`<option value="${o.value}" ${String(o.value)===String(val)?'selected':''}>${o.label}</option>`).join('')}</select></div>`;
  }
  if(f.type==='tags'){
    return `<div class="field" style="grid-column:1/-1"><label for="${id}">${f.label}</label><input type="text" id="${id}" placeholder="separadas por vírgula" value="${esc(Array.isArray(val)?val.join(', '):(val||''))}"></div>`;
  }
  return `<div class="field"><label for="${id}">${f.label}</label><input type="${f.type||'text'}" id="${id}" placeholder="${f.placeholder||''}" value="${esc(val)}" ${f.step?`step="${f.step}"`:''}></div>`;
}
function readField(f){
  const el = document.getElementById(`f_${f.key}`);
  if(!el) return undefined;
  if(f.type==='tags') return el.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(f.type==='number') return el.value===''? null : Number(el.value);
  return el.value;
}
function formModal({title, table, fields, record, beforeSave, afterSave, extraHtmlTop='', deleteAllowed=true}){
  const grouped = [];
  for(let i=0;i<fields.length;i++){
    if(fields[i].full || fields[i].type==='textarea' || fields[i].type==='tags'){ grouped.push([fields[i]]); }
    else if(fields[i+1] && !fields[i+1].full && fields[i+1].type!=='textarea' && fields[i+1].type!=='tags'){ grouped.push([fields[i], fields[i+1]]); i++; }
    else grouped.push([fields[i]]);
  }
  const bodyHtml = extraHtmlTop + grouped.map(row=>
    row.length===2? `<div class="field-row">${fieldHtml(row[0], record?.[row[0].key])}${fieldHtml(row[1], record?.[row[1].key])}</div>`
                   : fieldHtml(row[0], record?.[row[0].key])
  ).join('');
  const footHtml = `
    ${record&&deleteAllowed?`<button class="btn btn-danger" id="fm-delete" style="margin-right:auto">${icon('trash',14)} Eliminar</button>`:''}
    <button class="btn btn-ghost" id="fm-cancel">Cancelar</button>
    <button class="btn btn-primary" id="fm-save">${icon('check',14)} Guardar</button>`;
  openModal({
    title, bodyHtml, footHtml,
    onMount:(box)=>{
      box.querySelector('#fm-cancel').onclick = closeModal;
      if(record){
        const delBtn = box.querySelector('#fm-delete');
        if(delBtn) delBtn.onclick = async ()=>{
          const ok = await confirmDialog('Tens a certeza que queres eliminar este registo? Esta ação não pode ser desfeita.');
          if(ok){ await dbDelete(table, record.id); closeModal(); afterSave&&afterSave(); }
        };
      }
      box.querySelector('#fm-save').onclick = async ()=>{
        let payload = {};
        fields.forEach(f=>{ const v = readField(f); if(v!==undefined) payload[f.key]=v===''?null:v; });
        if(beforeSave) payload = beforeSave(payload)||payload;
        if(record) await dbUpdate(table, record.id, payload);
        else await dbInsert(table, payload);
        closeModal();
        afterSave && afterSave();
      };
    }
  });
}

function habitDueToday(h){
  const dow = new Date().getDay();
  if(h.frequency_type==='daily') return true;
  if(h.frequency_type==='specific_days') return (h.frequency_data?.days||[]).includes(dow);
  return true; // weekly_count: consider always visible, count tracked separately
}

const GOAL_UNITS = [{value:'horas',label:'Horas'},{value:'minutos',label:'Minutos'},{value:'livros',label:'Livros'},{value:'paginas',label:'Páginas'},{value:'quantidade',label:'Quantidade'},{value:'outro',label:'Outro'}];
function goalTargetMinutes(g){ if(g.unit==='horas') return g.target*60; if(g.unit==='minutos') return g.target; return null; }
function goalAcc(g, logs){ return logs.filter(t=>t.goal_id===g.id).reduce((s,t)=>s+(t.duration_minutes||0),0); }
function goalDisplay(g, acc){
  if(g.unit==='horas') return {have:fmtDuration(acc), total:fmtDuration(g.target*60), pct: g.target>0? Math.min(100, acc/(g.target*60)*100):0};
  if(g.unit==='minutos') return {have:fmtDuration(acc), total:fmtDuration(g.target), pct: g.target>0? Math.min(100, acc/g.target*100):0};
  return {have:`${fmtPct(acc)} ${g.unit}`, total:`${fmtPct(g.target)} ${g.unit}`, pct: g.target>0? Math.min(100, acc/g.target*100):0};
}
VIEW_RENDERERS.metas = async (wrap)=>{
  let [goals, logs] = await Promise.all([dbList('goals', {order:'created_at', asc:true}), dbList('time_logs')]);
  function draw(){
    const top = goals.filter(g=>!g.parent_id);
    document.getElementById('metas-list').innerHTML = top.length? `<div class="grid grid-2">${top.map(g=>goalCard(g, goals, logs)).join('')}</div>` :
      `<div class="empty-state">${icon('target',36)}<h3>Ainda sem metas</h3><p>Cria a tua primeira meta — por exemplo, "Inglês · 1500 horas".</p></div>`;
    wrap.querySelectorAll('[data-goal-open]').forEach(el=>el.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-stop-prop]')) return;
      openGoalDetail(goals.find(g=>g.id===el.dataset.goalOpen), goals, logs, refresh);
    }));
  }
  async function refresh(){ [goals, logs] = await Promise.all([dbList('goals', {order:'created_at', asc:true}), dbList('time_logs')]); draw(); }
  wrap.innerHTML = `
    <div class="view-head"><div><div class="view-eyebrow">Crescimento</div><h1 class="view-title">Metas</h1><div class="view-sub">Progresso acumulado, médias e percentagem — tudo calculado automaticamente.</div></div>
      <button class="btn btn-primary" id="new-goal">${icon('plus',15)} Nova meta</button></div>
    <div id="metas-list"></div>`;
  draw();
  document.getElementById('new-goal').onclick = ()=>openGoalModal(null, null, refresh);
};
function goalCard(g, allGoals, logs){
  const acc = goalAcc(g, logs) + allGoals.filter(s=>s.parent_id===g.id).reduce((s,sg)=>s+goalAcc(sg,logs),0);
  const d = goalDisplay(g, acc);
  const subs = allGoals.filter(s=>s.parent_id===g.id);
  const days = g.start_date? Math.max(1, daysBetween(g.start_date, todayISO())) : 1;
  const dailyAvg = acc/days;
  return `<div class="card card-hover" data-goal-open="${g.id}">
    <div class="flex items-center gap-8" style="justify-content:space-between; margin-bottom:4px">
      <h3 style="font-size:17px">${esc(g.name)}</h3>
      <span class="badge badge-status-${g.status==='ativo'?'em_andamento':g.status==='concluida'?'concluido':'pendente'}">${g.status}</span>
    </div>
    ${g.description?`<div class="text-dim text-sm" style="margin-bottom:10px">${esc(g.description)}</div>`:''}
    <div class="flex items-center gap-8" style="justify-content:space-between; margin-bottom:8px">
      <span class="mono" style="font-size:15px; font-weight:600">${d.have} <span class="text-faint" style="font-weight:400"> / ${d.total}</span></span>
      <span class="text-faint text-sm">${fmtPct(d.pct)}%</span>
    </div>
    <div class="progress-track" style="margin-bottom:12px"><div class="progress-fill" style="width:${d.pct}%"></div></div>
    ${subs.length? `<div class="grid grid-2" style="gap:10px; margin-bottom:10px" data-stop-prop>
      ${subs.map(s=>{ const sacc = goalAcc(s,logs); const sd = goalDisplay(s, sacc);
        return `<div style="background:var(--card-raised); border-radius:11px; padding:11px 13px">
          <div class="text-sm" style="font-weight:600; margin-bottom:5px">${esc(s.name)}</div>
          <div class="progress-track" style="height:5px; margin-bottom:5px"><div class="progress-fill ${s.name.toLowerCase().includes('output')?'sky':'sage'}" style="width:${sd.pct}%"></div></div>
          <div class="text-faint text-sm mono">${sd.have} / ${sd.total}</div>
        </div>`; }).join('')}
    </div>` : ''}
    <div class="text-faint text-sm">Média diária: <span class="mono">${fmtDuration(dailyAvg)}</span> · desde ${fmtDateShort(g.start_date)}</div>
  </div>`;
}
function openGoalDetail(g, allGoals, logs, onChange){
  const subs = allGoals.filter(s=>s.parent_id===g.id);
  const acc = goalAcc(g, logs) + subs.reduce((s,sg)=>s+goalAcc(sg,logs),0);
  const d = goalDisplay(g, acc);
  const recent = logs.filter(t=>t.goal_id===g.id || subs.some(s=>s.id===t.goal_id)).sort((a,b)=>new Date(b.log_date)-new Date(a.log_date)).slice(0,8);
  openModal({
    title: g.name, wide:true,
    bodyHtml:`
      <div class="mono" style="font-size:22px; font-weight:600; margin-bottom:6px">${d.have} <span class="text-faint" style="font-size:15px; font-weight:400"> / ${d.total}</span></div>
      <div class="progress-track" style="margin-bottom:16px"><div class="progress-fill" style="width:${d.pct}%"></div></div>
      ${g.description?`<p class="prose text-dim" style="margin-bottom:16px">${esc(g.description)}</p>`:''}
      ${subs.length?`<div class="grid grid-2" style="margin-bottom:16px">${subs.map(s=>{
        const sacc = goalAcc(s,logs); const sd = goalDisplay(s,sacc);
        return `<div class="card" style="padding:14px"><div style="font-weight:600; margin-bottom:6px">${esc(s.name)}</div>
        <div class="progress-track" style="margin-bottom:6px"><div class="progress-fill sage" style="width:${sd.pct}%"></div></div>
        <div class="mono text-sm">${sd.have} / ${sd.total} (${fmtPct(sd.pct)}%)</div></div>`;}).join('')}</div>`:''}
      <div class="section-title" style="margin-top:6px">Registos recentes</div>
      <div class="list">${recent.length? recent.map(t=>`<div class="row-item"><div class="ri-main"><div class="ri-title">${esc(t.activity)}${t.detail?' · '+esc(t.detail):''}</div><div class="ri-meta">${fmtDateShort(t.log_date)}</div></div><div class="mono text-sm">${fmtDuration(t.duration_minutes)}</div></div>`).join('') : '<div class="text-faint text-sm">Sem registos ainda.</div>'}</div>
    `,
    footHtml:`
      <button class="btn btn-danger" id="gd-del" style="margin-right:auto">${icon('trash',14)} Eliminar</button>
      ${!g.parent_id?`<button class="btn btn-ghost" id="gd-sub">${icon('plus',13)} Sub-meta</button>`:''}
      <button class="btn btn-ghost" id="gd-edit">${icon('edit',13)} Editar</button>
      <button class="btn btn-primary" id="gd-progress">${icon('plus',14)} Adicionar progresso</button>`,
    onMount:(box)=>{
      box.querySelector('#gd-del').onclick = async ()=>{ if(await confirmDialog('Eliminar esta meta? Os registos de tempo associados não serão apagados.')){ await dbDelete('goals', g.id); closeModal(); onChange(); } };
      box.querySelector('#gd-edit').onclick = ()=>openGoalModal(g, g.parent_id, ()=>{ closeModal(); onChange(); });
      const subBtn = box.querySelector('#gd-sub'); if(subBtn) subBtn.onclick = ()=>openGoalModal(null, g.id, ()=>{ closeModal(); onChange(); });
      box.querySelector('#gd-progress').onclick = ()=>openTimeLogModal(null, {goalId: subs.length? null : g.id, presetActivity:g.name}, ()=>{ closeModal(); onChange(); });
    }
  });
}
function openGoalModal(record, parentId, onSaved){
  formModal({
    title: record? 'Editar meta' : (parentId? 'Nova sub-meta' : 'Nova meta'),
    table:'goals', record,
    fields:[
      {key:'name', label:'Nome', placeholder:'ex: Inglês, Bíblia, Leitura'},

      {key:'description', label:'Descrição', type:'textarea', full:true},

const TIME_ACTIVITIES = ['Inglês','Bíblia','Oração','Leitura','Programação','Trabalho','Exercício','Outro'];
VIEW_RENDERERS.tempo = async (wrap)=>{
  let [logs, goals, activityTargets] = await Promise.all([dbList('time_logs', {order:'log_date', asc:false, limit:2000}), dbList('goals'), dbList('activity_targets')]);
  function drawTargets(){
    const el = document.getElementById('atarget-body');
    if(!el) return;
    el.innerHTML = activityTargets.length? activityTargets.map(t=>activityTargetCard(t, logs)).join('') :
      `<div class="empty-state" style="padding:20px">${icon('target',30)}<h3>Sem metas definidas</h3><p>Define uma meta semanal ou mensal para acompanhar o teu progresso em cada atividade.</p></div>`;
    el.querySelectorAll('[data-edit-atarget]').forEach(btn=>btn.onclick=()=>{
      const t = activityTargets.find(x=>x.id===btn.dataset.editAtarget);
      openActivityTargetModal(t.activity, t, refreshTargets);
    });
  }
  async function refreshTargets(){ activityTargets = await dbList('activity_targets'); drawTargets(); }
  function drawTotals(){
    const el = document.getElementById('time-totals');
    if(!el) return;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayS = isoDay(today);
    const weekS = isoDay(startOfWeek(today));
    const weekE = isoDay(addDays(startOfWeek(today),6));
    const monthS = isoDay(new Date(today.getFullYear(), today.getMonth(), 1));
    const monthE = isoDay(new Date(today.getFullYear(), today.getMonth()+1, 0));
    const sum = (from, to)=> logs.filter(l=>l.log_date>=from && l.log_date<=to).reduce((s,l)=>s+(l.duration_minutes||0),0);
    el.innerHTML = `
      <div class="card stat-card"><div class="lbl">${icon('clock',14)} Hoje</div><div class="val">${fmtDuration(sum(todayS,todayS))}</div></div>
      <div class="card stat-card"><div class="lbl">${icon('clock',14)} Esta semana</div><div class="val">${fmtDuration(sum(weekS,weekE))}</div></div>
      <div class="card stat-card"><div class="lbl">${icon('clock',14)} Este mês</div><div class="val">${fmtDuration(sum(monthS,monthE))}</div></div>`;
  }
  function draw(){
    const q = (document.getElementById('tb-search')?.value||'').toLowerCase();
    let list = logs;
    if(q) list = list.filter(l=>(l.activity||'').toLowerCase().includes(q) || (l.detail||'').toLowerCase().includes(q) || (l.note||'').toLowerCase().includes(q));
    document.getElementById('tempo-list').innerHTML = list.length? list.slice(0,100).map(timeLogRow).join('') :
      `<div class="empty-state">${icon('clock',36)}<h3>Ainda sem registos de tempo</h3><p>Usa o registo manual (principal) ou o cronómetro abaixo.</p></div>`;
    wrap.querySelectorAll('[data-tlog]').forEach(el=>el.addEventListener('click', ()=>{
      const rec = logs.find(l=>l.id===el.dataset.tlog);
      openTimeLogModal(rec, {}, refresh);
    }));
    drawTotals();
  }
  async function refresh(){ [logs, goals] = await Promise.all([dbList('time_logs', {order:'log_date', asc:false, limit:2000}), dbList('goals')]); draw(); renderTimerCard(); drawTargets(); }
  function renderTimerCard(){
    const c = document.getElementById('timer-card');
    if(!c) return;
    c.innerHTML = `
      <div class="timer-widget">
        <div class="timer-display" id="timer-display">${fmtTimer(state.timer.seconds)}</div>
        <div style="flex:1; min-width:160px">
          <select id="timer-activity" style="width:100%">${TIME_ACTIVITIES.map(a=>`<option ${state.timer.activity===a?'selected':''}>${a}</option>`).join('')}</select>
        </div>
        <div class="flex gap-8">
          ${!state.timer.running? `<button class="btn btn-primary" id="timer-start">${icon('play',14)} Iniciar</button>` :
            `<button class="btn" id="timer-pause">${icon('pause',14)} Pausar</button><button class="btn btn-primary" id="timer-stop">${icon('stop',14)} Finalizar</button>`}
        </div>
      </div>`;
    const startBtn = c.querySelector('#timer-start');
    if(startBtn) startBtn.onclick = ()=>{
      state.timer.activity = c.querySelector('#timer-activity').value;
      state.timer.running = true;
      state.timer.interval = setInterval(()=>{ state.timer.seconds++; const d=document.getElementById('timer-display'); if(d) d.textContent=fmtTimer(state.timer.seconds); }, 1000);
      renderTimerCard();
    };
    const pauseBtn = c.querySelector('#timer-pause');
    if(pauseBtn) pauseBtn.onclick = ()=>{ state.timer.running=false; clearInterval(state.timer.interval); renderTimerCard(); };
    const stopBtn = c.querySelector('#timer-stop');
    if(stopBtn) stopBtn.onclick = async ()=>{
      clearInterval(state.timer.interval);
      const mins = Math.round(state.timer.seconds/60);
      const activity = state.timer.activity;
      state.timer = {running:false, seconds:0, activity:null, interval:null};
      renderTimerCard();
      if(mins>0) openTimeLogModal(null, {presetActivity:activity, presetMinutes:mins, source:'timer'}, refresh);
    };
  }
  wrap.innerHTML = `
    <div class="view-head"><div><div class="view-eyebrow">Crescimento</div><h1 class="view-title">Controlo de tempo</h1><div class="view-sub">Registo manual (principal) ou cronómetro — a tua escolha.</div></div>
      <button class="btn btn-primary" id="new-tlog">${icon('plus',15)} Registar tempo</button></div>
    <div class="card" id="timer-card" style="margin-bottom:26px"></div>
    <div class="grid grid-3" id="time-totals" style="margin-bottom:26px"></div>
    <div class="view-head" style="margin-bottom:14px"><h2 style="font-size:17px; font-weight:600">Metas por atividade</h2>
      <button class="btn btn-ghost btn-sm" id="new-atarget">${icon('plus',13)} Nova meta</button></div>
    <div id="atarget-body" style="margin-bottom:26px"></div>
    ${toolbarHtml({searchPlaceholder:'Pesquisar registos de tempo...'})}
    <div class="list" id="tempo-list"></div>`;
  renderTimerCard();
  draw();
  drawTargets();
  document.getElementById('tb-search').addEventListener('input', draw);
  document.getElementById('new-tlog').onclick = ()=>openTimeLogModal(null, {}, refresh);
  document.getElementById('new-atarget').onclick = ()=>{
    const configured = new Set(activityTargets.map(t=>t.activity));
    const available = TIME_ACTIVITIES.filter(a=>!configured.has(a));
    if(!available.length){ toast('Já definiste metas para todas as atividades.', 'err'); return; }
    openActivityPicker(available, (activity)=> openActivityTargetModal(activity, null, refreshTargets));
  };
};
function fmtTimer(sec){ const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':'); }
function timeLogRow(t){

/* ============================================================
   METAS POR ATIVIDADE  (semanais/mensais, facultativas)
   ============================================================ */
function sumRange(logs, activity, fromISO, toISO){
  const f = logs.filter(l=>l.activity===activity && l.log_date>=fromISO && l.log_date<=toISO);
  return {minutes: f.reduce((s,l)=>s+(l.duration_minutes||0),0), count: f.length};
}
function targetProgress(mode, target, stats){
  if(!mode || !target) return null;
  if(mode==='tempo'){
    const need = target*60;
    return {pct: need>0? Math.min(100, stats.minutes/need*100):0, haveLabel: fmtDuration(stats.minutes), needLabel: fmtDuration(need), met: stats.minutes>=need};
  }
  return {pct: target>0? Math.min(100, stats.count/target*100):0, haveLabel: `${stats.count}x`, needLabel: `${target}x`, met: stats.count>=target};
}
function startOfPeriod(d, unit){ return unit==='week'? startOfWeek(d) : new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfPeriod(start, unit){ return unit==='week'? addDays(start,6) : new Date(start.getFullYear(), start.getMonth()+1, 0); }
function nextPeriod(start, unit){ return unit==='week'? addDays(start,7) : new Date(start.getFullYear(), start.getMonth()+1, 1); }
function periodsHistory(activity, mode, target, logs, createdAt, unit){
  if(!mode || !target) return null;
  const created = new Date(createdAt); created.setHours(0,0,0,0);
  let cursor = startOfPeriod(created, unit);
  const currentStart = startOfPeriod(new Date(), unit);
  let total=0, met=0;
  while(cursor < currentStart){
    const end = endOfPeriod(cursor, unit);
    const stats = sumRange(logs, activity, isoDay(cursor), isoDay(end));
    const ok = mode==='tempo'? stats.minutes >= target*60 : stats.count >= target;
    if(ok) met++;
    total++;
    cursor = nextPeriod(cursor, unit);
  }
  return {met, total};
}
function activityTargetCard(t, logs){
  const today = new Date();
  const weekStats = t.weekly_mode? targetProgress(t.weekly_mode, t.weekly_target, sumRange(logs, t.activity, isoDay(startOfWeek(today)), isoDay(addDays(startOfWeek(today),6)))) : null;
  const monthStats = t.monthly_mode? targetProgress(t.monthly_mode, t.monthly_target, sumRange(logs, t.activity, isoDay(new Date(today.getFullYear(),today.getMonth(),1)), isoDay(new Date(today.getFullYear(),today.getMonth()+1,0)))) : null;
  const weekHist = t.weekly_mode? periodsHistory(t.activity, t.weekly_mode, t.weekly_target, logs, t.created_at, 'week') : null;
  const monthHist = t.monthly_mode? periodsHistory(t.activity, t.monthly_mode, t.monthly_target, logs, t.created_at, 'month') : null;
  return `<div class="card" style="padding:16px; margin-bottom:12px">
    <div class="flex" style="justify-content:space-between; align-items:center; margin-bottom:12px">
      <div style="font-weight:600">${esc(t.activity)}</div>
      <button class="btn btn-ghost btn-sm" data-edit-atarget="${t.id}">${icon('edit',13)} Editar</button>
    </div>
    ${weekStats? `<div style="margin-bottom:${monthStats?'14px':'0'}">
      <div class="flex" style="justify-content:space-between; font-size:13px; color:var(--text-dim); margin-bottom:6px"><span>Meta semanal</span><span class="mono">${weekStats.haveLabel} / ${weekStats.needLabel}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${weekStats.pct}%"></div></div>
      <div class="text-faint text-sm" style="margin-top:6px">${weekHist.total? `Cumpriste ${weekHist.met} de ${weekHist.total} semana(s) anteriores` : 'Ainda sem semanas completas'}</div>
    </div>` : ''}
    ${monthStats? `<div>
      <div class="flex" style="justify-content:space-between; font-size:13px; color:var(--text-dim); margin-bottom:6px"><span>Meta mensal</span><span class="mono">${monthStats.haveLabel} / ${monthStats.needLabel}</span></div>
      <div class="progress-track"><div class="progress-fill sky" style="width:${monthStats.pct}%"></div></div>
      <div class="text-faint text-sm" style="margin-top:6px">${monthHist.total? `Cumpriste ${monthHist.met} de ${monthHist.total} mês(es) anteriores` : 'Ainda sem meses completos'}</div>
    </div>` : ''}
  </div>`;
}

VIEW_RENDERERS.agenda = async (wrap)=>{
  let events = await dbList('events', {order:'event_date', asc:true});
  let mode = 'semana';
  function rangeFor(mode){
    const today = new Date(); today.setHours(0,0,0,0);
    if(mode==='dia') return [isoDay(today), isoDay(today)];
    if(mode==='mes'){ const s = new Date(today.getFullYear(), today.getMonth(),1); const e = new Date(today.getFullYear(), today.getMonth()+1,0); return [isoDay(s), isoDay(e)]; }
    const s = startOfWeek(today); const e = addDays(s,6); return [isoDay(s), isoDay(e)];
  }
  function draw(){
    const [s,e] = rangeFor(mode);
    const list = events.filter(ev=>ev.event_date>=s && ev.event_date<=e);
    const byDay = {};
    list.forEach(ev=>{ (byDay[ev.event_date] = byDay[ev.event_date]||[]).push(ev); });
    const days = Object.keys(byDay).sort();
    document.getElementById('agenda-body').innerHTML = days.length? days.map(d=>`
      <div class="section-title" style="margin-top:22px">${fmtDateLong(d)}</div>
      <div class="list">${byDay[d].sort((a,b)=>(a.event_time||'').localeCompare(b.event_time||'')).map(eventRow).join('')}</div>
    `).join('') : `<div class="empty-state">${icon('calendar',36)}<h3>Sem eventos neste período</h3><p>Adiciona um compromisso para começares a preencher a tua agenda.</p></div>`;
    wrap.querySelectorAll('[data-ev]').forEach(el=>el.addEventListener('click', ()=>{
      openEventModal(events.find(ev=>ev.id===el.dataset.ev), refresh);
    }));
  }
  async function refresh(){ events = await dbList('events', {order:'event_date', asc:true}); draw(); }
  wrap.innerHTML = `
    <div class="view-head"><div><div class="view-eyebrow">Organização</div><h1 class="view-title">Agenda</h1></div>
      <button class="btn btn-primary" id="new-event">${icon('plus',15)} Novo evento</button></div>
    <div class="chip-row"><div class="chip" data-m="dia">Dia</div><div class="chip active" data-m="semana">Semana</div><div class="chip" data-m="mes">Mês</div></div>
    <div id="agenda-body"></div>`;
  draw();
  wrap.querySelectorAll('.chip-row .chip').forEach(c=>c.onclick=()=>{ wrap.querySelectorAll('.chip-row .chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); mode=c.dataset.m; draw(); });
  document.getElementById('new-event').onclick = ()=>openEventModal(null, refresh);
};

    <div style="width:34px;height:34px;border-radius:10px;background:var(--sky-soft);display:flex;align-items:center;justify-content:center;color:var(--sky);flex-shrink:0">${icon('calendar',15)}</div>
    <div class="ri-main"><div class="ri-title">${esc(e.title)}</div><div class="ri-meta">${e.event_time?e.event_time+' · ':''}${esc(e.location||'')}${e.category?` · ${esc(e.category)}`:''}</div></div>

VIEW_RENDERERS.habitos = async (wrap)=>{
  let [habits, logs] = await Promise.all([dbList('habits', {order:'created_at', asc:true}), dbList('habit_logs')]);
  async function refresh(){ [habits, logs] = await Promise.all([dbList('habits',{order:'created_at',asc:true}), dbList('habit_logs')]); draw(); }
  function draw(){
    document.getElementById('habit-grid').innerHTML = habits.length? habits.map(h=>habitCard(h, logs)).join('') :
      `<div class="empty-state">${icon('flame',36)}<h3>Sem hábitos ainda</h3><p>Cria um hábito, ex: "Orar", "Ler", "Inglês".</p></div>`;
    wrap.querySelectorAll('[data-habit-toggle]').forEach(b=>b.onclick=async(e)=>{
      e.stopPropagation();
      const today = todayISO();
      const existing = logs.filter(l=>l.habit_id===b.dataset.habitToggle && l.log_date===today);
      if(existing.length) await dbDelete('habit_logs', existing[0].id);
      else await dbInsert('habit_logs', {habit_id:b.dataset.habitToggle, log_date:today, completed:true});
      refresh();
    });
    wrap.querySelectorAll('[data-habit-edit]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openHabitModal(habits.find(h=>h.id===b.dataset.habitEdit), refresh); });
  }
  wrap.innerHTML = `
    <div class="view-head"><div><div class="view-eyebrow">Crescimento</div><h1 class="view-title">Hábitos</h1><div class="view-sub">Consistência silenciosa, dia após dia.</div></div>
      <button class="btn btn-primary" id="new-habit">${icon('plus',15)} Novo hábito</button></div>
    <div class="grid grid-2" id="habit-grid"></div>`;
  draw();
  document.getElementById('new-habit').onclick = ()=>openHabitModal(null, refresh);
};
function habitCard(h, logs){
  const hlogs = logs.filter(l=>l.habit_id===h.id).map(l=>l.log_date);
  const today = new Date();
  let streak = 0;
  for(let i=0;i<365;i++){ const d = isoDay(addDays(today, -i)); if(hlogs.includes(d)) streak++; else break; }
  let best = 0, cur = 0;
  const sorted = [...hlogs].sort();
  for(let i=0;i<sorted.length;i++){ if(i>0 && daysBetween(sorted[i-1], sorted[i])===1) cur++; else cur=1; best=Math.max(best,cur); }
  const last14 = Array.from({length:14}).map((_,i)=> isoDay(addDays(today, -(13-i))));
  const doneToday = hlogs.includes(isoDay(today));
  const completionRate = last14.length? Math.round(last14.filter(d=>hlogs.includes(d)).length/14*100) : 0;
  return `<div class="card" data-habit-card="${h.id}">
    <div class="flex items-center gap-8" style="justify-content:space-between; margin-bottom:10px">
      <div><div style="font-weight:600; font-size:15px">${esc(h.name)}</div><div class="text-faint text-sm">${esc(h.category||'')}</div></div>
      <button class="icon-btn btn" data-habit-edit="${h.id}">${icon('edit',13)}</button>
    </div>
    <div class="habit-grid" style="margin-bottom:12px">${last14.map(d=>`<div class="hcell ${hlogs.includes(d)?'on':''}" title="${d}"></div>`).join('')}</div>
    <div class="flex items-center gap-8" style="justify-content:space-between">
      <div class="flex gap-12" style="font-size:12px">
        <span class="text-dim">🔥 ${streak} seguidos</span><span class="text-faint">melhor: ${best}</span><span class="text-faint">${completionRate}% (14d)</span>
      </div>
      <button class="btn btn-sm ${doneToday?'':'btn-primary'}" data-habit-toggle="${h.id}">${doneToday?'Feito ✓':'Marcar hoje'}</button>
    </div>
  </div>`;
}

}

VIEW_RENDERERS.estatisticas = async (wrap)=>{

  const byDay = d=> logs.filter(l=>l.log_date===d).reduce((s,l)=>s+(l.duration_minutes||0),0)/60;
  const byActivity = {};
  logs.forEach(l=>{ byActivity[l.activity] = (byActivity[l.activity]||0) + (l.duration_minutes||0); });
  const english = logs.filter(l=>l.activity==='Inglês' || l.activity==='Ingles');
  const inputMin = english.filter(l=>l.subcategory==='input').reduce((s,l)=>s+(l.duration_minutes||0),0);
  const outputMin = english.filter(l=>l.subcategory==='output').reduce((s,l)=>s+(l.duration_minutes||0),0);
  const totalTasksDone = tasks.filter(t=>t.status==='concluida').length;
  const weekTotal = last7.reduce((s,d)=>s+byDay(d)*60,0);

    </div>
    <div class="grid grid-2" style="margin-bottom:24px">
      <div class="card"><h3 style="font-size:15px; margin-bottom:14px">Horas por dia (30 dias)</h3><canvas id="chart-daily" height="180"></canvas></div>
      <div class="card"><h3 style="font-size:15px; margin-bottom:14px">Tempo por atividade</h3><canvas id="chart-activity" height="180"></canvas></div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3 style="font-size:15px; margin-bottom:14px">Inglês — Input vs Output</h3><canvas id="chart-io" height="180"></canvas></div>
      <div class="card"><h3 style="font-size:15px; margin-bottom:14px">Hábitos — taxa de conclusão (14 dias)</h3><canvas id="chart-habits" height="180"></canvas></div>
    </div>
  `;
  const gold='#C9A35F', sky='#6E93B7', sage='#7FA88C', rose='#BD7B7B', dim='#5E6779';
  Chart.defaults.color = '#A6AEBF'; Chart.defaults.font.family = 'Inter';
  new Chart(document.getElementById('chart-daily'), {type:'bar', data:{labels:last30.map(d=>d.slice(8)), datasets:[{data:last30.map(d=>Math.round(byDay(d)*10)/10), backgroundColor:gold, borderRadius:4}]},
    options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}, y:{grid:{color:'#1D232D'}}}}});
  const actEntries = Object.entries(byActivity).sort((a,b)=>b[1]-a[1]).slice(0,6);
  new Chart(document.getElementById('chart-activity'), {type:'doughnut', data:{labels:actEntries.map(a=>a[0]), datasets:[{data:actEntries.map(a=>a[1]), backgroundColor:[gold,sky,sage,rose,'#8C7645','#4A6E90']}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, padding:12}}}}});
  new Chart(document.getElementById('chart-io'), {type:'bar', data:{labels:['Input','Output'], datasets:[{data:[Math.round(inputMin/60*10)/10, Math.round(outputMin/60*10)/10], backgroundColor:[sky,sage], borderRadius:6}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#1D232D'}}, y:{grid:{display:false}}}}});
  const hRates = habits.map(h=>{ const c = last14ForHabit(h.id, hlogs); return {name:h.name, rate:c}; });
  function last14ForHabit(id, hlogs){ const days = Array.from({length:14}).map((_,i)=>isoDay(addDays(today,-(13-i)))); const done = hlogs.filter(l=>l.habit_id===id).map(l=>l.log_date); return Math.round(days.filter(d=>done.includes(d)).length/14*100); }
  new Chart(document.getElementById('chart-habits'), {type:'bar', data:{labels:hRates.map(h=>h.name), datasets:[{data:hRates.map(h=>h.rate), backgroundColor:sage, borderRadius:6}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{max:100, grid:{color:'#1D232D'}}, y:{grid:{display:false}}}}});

function openWeeklyReview(record, logs, tasks, onSaved){

  const wk = logs.filter(l=>l.log_date>=s && l.log_date<=e);

  const eng = wk.filter(l=>l.activity==='Inglês');
  const doneTasks = tasks.filter(t=>t.status==='concluida' && t.updated_at?.slice(0,10)>=s && t.updated_at?.slice(0,10)<=e).length;
  const statsHtml = `<div class="card" style="margin-bottom:16px; padding:16px">

      <div><div class="text-faint text-sm">Tarefas concluídas</div><div class="mono" style="font-weight:600">${doneTasks}</div></div>
      <div><div class="text-faint text-sm">Período</div><div class="text-sm" style="font-weight:600">${fmtDateShort(s)} – ${fmtDateShort(e)}</div></div>
    </div></div>`;
  formModal({
    title: record?'Editar revisão semanal':'Nova revisão semanal', table:'weekly_reviews', record,
    extraHtmlTop: statsHtml,
    fields:[
      {key:'week_start', label:'Início da semana', type:'date', default:s},
      {key:'week_end', label:'Fim da semana', type:'date', default:e},
      {key:'did', label:'O que fiz esta semana?', type:'textarea', full:true},
      {key:'learned', label:'O que aprendi?', type:'textarea', full:true},
      {key:'went_well', label:'O que correu bem?', type:'textarea', full:true},
      {key:'failed', label:'Onde falhei?', type:'textarea', full:true},
      {key:'improve', label:'O que preciso melhorar?', type:'textarea', full:true},
      {key:'grateful', label:'Pelo que sou grato?', type:'textarea', full:true},
      {key:'next_priorities', label:'Prioridades para a próxima semana', type:'textarea', full:true},
    ], afterSave:onSaved,
  });
}
function openMonthlyReview(record, onSaved){
  const s = record?.month_start || isoDay(new Date(new Date().getFullYear(), new Date().getMonth(),1));
  const e = record?.month_end || isoDay(new Date(new Date().getFullYear(), new Date().getMonth()+1,0));
  formModal({
    title: record?'Editar revisão mensal':'Nova revisão mensal', table:'monthly_reviews', record,
    fields:[
      {key:'month_start', label:'Início do mês', type:'date', default:s},
      {key:'month_end', label:'Fim do mês', type:'date', default:e},
      {key:'summary', label:'Resumo do mês (metas, principais registos, decisões)', type:'textarea', full:true},
      {key:'what_changed', label:'O que mudou em mim neste mês?', type:'textarea', full:true},
      {key:'learned', label:'Aprendizados', type:'textarea', full:true},
      {key:'decisions_note', label:'Decisões tomadas', type:'textarea', full:true},
    ], afterSave:onSaved,
  });
}

    <div class="section-title">${icon('lock2',18)} Sobre a proteção deste espaço</div>
    <div class="card"><p class="text-sm text-dim">Esta aplicação usa a chave "anon" pública do Supabase, protegida apenas pelo código de acesso desta interface — adequado para uso pessoal. Não coloques a chave "service_role" aqui. Para maior segurança no futuro, considera ativar o Supabase Auth.</p></div>
  `;

  document.getElementById('export-csv').onclick = exportAllCSV;
};
async function exportAllJSON(){
  toast('A preparar exportação...');
  const out = {};
  for(const t of ALL_TABLES){ out[t] = await dbList(t, {limit:100000}); }
  downloadFile(`norte-backup-${todayISO()}.json`, JSON.stringify(out, null, 2), 'application/json');
  toast('Exportação concluída.');
}
async function exportAllCSV(){
  toast('A preparar exportação...');
  for(const t of ALL_TABLES){
    const rows = await dbList(t, {limit:100000});
    if(!rows.length) continue;
    const cols = Object.keys(rows[0]);
    const csv = [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\n');
    downloadFile(`norte-${t}-${todayISO()}.csv`, csv, 'text/csv');
  }
  toast('Exportação concluída.');
}
function csvCell(v){
  if(v==null) return '';
  if(Array.isArray(v)) v = v.join('; ');
  if(typeof v==='object') v = JSON.stringify(v);
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s)? `"${s}"` : s;
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}
